<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bread and wine - Manage your stock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script type="module" src="app.js"></script>

    <header>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" autocomplete="email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <button type="button" id="registerBtn">Register</button>
        </form>

        <form id="registerForm" class="hidden">
            <input type="email" id="email" placeholder="Email" autocomplete="email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Register</button>
            <button type="button" id="loginBtn">Login</button>
        </form>

        <div id="userPanel" style="display:none">
            <span id="userEmail"></span>
            <button id="signOutBtn">Sign Out</button>
        </div>
    </header>

    <div id="welcome-screen" class="shadow gradient-magenta-blue">
        <div id="welcome-container">
            <h1>Welcome</h1>
            <p>Organize all your products, shopping lists, and personal inventory in a simple and flexible way. Make better everyday decisions with a clean, customizable interface that adapts to your needs.</p>
            <p>Sign up for free!</p>
        </div>
    </div>
    
    <main class="hidden">
        <nav id="menuBar"></nav>

        <div class="stock-table">
            <h1>My current stock</h1>

            <div class="action-buttons">
                <button id="show-hide-btn">Show all columns</button>
            </div>

            <div class="search-bar">
                <input type="text" class="searchInput" data-table="stock-table" placeholder="Search...">
            </div>

            <table id="inventory"></table>

            <!--To do: add "+" button to show/hide addForm-->
            <button id="add-item-button">+</button>

            <!-- Replaced by addItemBtn -->
            <form id="addForm" class="hidden">
                <h3>Add new item</h3>
                <input type="text" name="name" placeholder="New item">
                <input type="number" name="quantity" placeholder="1x">
                <input type="number" step="0.01" name="price" placeholder="Price"">

                <!--To do: add categories from visible table columns (Group, Count etc.)-->
                <button type="submit">Save</button>
                <button type="reset">Clear</button>
            </form>
            
            <form id="addColumnForm" class="hidden">
                <h3>Add new column</h3>
                
                <button type="button" id="newKeyBtn">+</button>
                <br>
                <button type="button" id="columnCancelBtn">Cancel</button>
                <button type="submit">Save</button>    
            </form>
        </div>
        
        <div class="shopping-list hidden">
            <h1>My shopping list</h1>

            <!--Select date-->
            <div class="shopping-header">
                <label for="shoppingDate">Shopping Date:</label>
                <input type="date" id="shoppingDate">
            </div>

            <div class="search-bar">
                <input type="text" class="searchInput" data-table="shopping-list" placeholder="Search...">
            </div>

            <!--Table-->
            <table id="shopping-list-table"></table>
        </div>

        <div class="navigation">
            <button class="active-view" id="show-stock-table">My Stock</button>
            <button id="show-shopping-list">My Shopping List</button>
        </div>
    </main>
</body>
